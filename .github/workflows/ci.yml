name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verifica:
    name: Build, lint e test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: ExifTool (macOS)
        if: runner.os == 'macOS'
        run: command -v exiftool || brew install exiftool

      - name: ExifTool (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install exiftool -y --no-progress

      - name: Formato (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Smoke test GUI headless (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y xvfb
          }
          UBERPHOTO_SMOKE_EXIT_SECS=6 xvfb-run -a ./target/release/uberphoto-app

      - name: Smoke test GUI (macOS, sperimentale)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: UBERPHOTO_SMOKE_EXIT_SECS=6 ./target/release/uberphoto-app

      - name: Smoke test GUI (Windows, sperimentale)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:UBERPHOTO_SMOKE_EXIT_SECS = "6"
          & .\target\release\uberphoto-app.exe
          if ($LASTEXITCODE -ne 0) { throw "uscita con codice $LASTEXITCODE" }
