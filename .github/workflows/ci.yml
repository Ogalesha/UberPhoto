name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  EXIFTOOL_VERSION: "13.59"
  EXIFTOOL_SHA256: "668ea3acececb7235fbd0f4900e72d5f12c9b07e5c778fd36cb1e9b5828fd65a"
  EXIFTOOL_WIN_SHA256: "44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec"

permissions:
  contents: read
  checks: write

jobs:
  verifica:
    name: Build, lint e test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: ExifTool (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: ExifTool (macOS)
        if: runner.os == 'macOS'
        run: command -v exiftool || brew install exiftool

      - name: ExifTool (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install exiftool -y --no-progress

      - name: Formato (rustfmt)
        run: cargo fmt --all --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt

      - name: Pubblica il log dei test (diagnostica)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'nessun log disponibile (passo precedente senza output)';
            try { log = fs.readFileSync('test-output.txt', 'utf8'); } catch (e) {}
            const tail = log.slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Log test - ${context.job} (${process.env.RUNNER_OS})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Log dei test (coda)', summary: '```\n' + tail + '\n```' },
            });

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Verifica pacchetto Linux (.deb con ExifTool incluso)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/build-deb.sh
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          STAGE="target/deb/uberphoto_${VERSION}_amd64"
          dpkg-deb --info "target/uberphoto_${VERSION}_amd64.deb"
          "$STAGE/usr/lib/uberphoto/exiftool/exiftool" -ver

      - name: Verifica bundle macOS (.app con ExifTool incluso)
        if: runner.os == 'macOS'
        run: |
          MACOS_ARCH=aarch64 bash packaging/macos/bundle.sh
          ./target/UberPhoto.app/Contents/Resources/exiftool/exiftool -ver

      - name: Verifica pacchetto Windows (ZIP e installer con ExifTool incluso)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/package.ps1 -ExifToolVersion $env:EXIFTOOL_VERSION -ExifToolSha256 $env:EXIFTOOL_WIN_SHA256 2>&1 | Tee-Object -FilePath target\package-log.txt
          & .\target\windows-package\exiftool.exe -ver
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$version" packaging\windows\installer.iss 2>&1 | Tee-Object -FilePath target\installer-log.txt -Append
          if ($LASTEXITCODE -ne 0) { throw "iscc uscito con codice $LASTEXITCODE" }

      - name: Pubblica il log del packaging Windows (diagnostica)
        if: failure() && runner.os == 'Windows'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            for (const file of ['target/package-log.txt', 'target/installer-log.txt', 'target/install-test-log.txt']) {
              try { log += `\n--- ${file} ---\n` + fs.readFileSync(file, 'utf8'); } catch (e) {}
            }
            if (!log) log = 'nessun log disponibile';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Log packaging - ${context.job} (${process.env.RUNNER_OS})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Log packaging (coda)', summary: '```\n' + log.slice(-60000) + '\n```' },
            });

      - name: Smoke test GUI headless (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 RUST_LOG=info,wgpu_core=info,wgpu_hal=info UBERPHOTO_SMOKE_EXIT_SECS=6 \
            xvfb-run -a -s "-screen 0 1280x800x24" ./target/release/uberphoto-app 2>&1 | tee smoke-output.txt

      - name: Pubblica il log dello smoke test (diagnostica)
        if: failure() && runner.os == 'Linux'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'nessun log disponibile (passo precedente senza output)';
            try { log = fs.readFileSync('smoke-output.txt', 'utf8'); } catch (e) {}
            const tail = log.slice(-60000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Log smoke - ${context.job} (${process.env.RUNNER_OS})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Log dello smoke test (coda)', summary: '```\n' + tail + '\n```' },
            });

      - name: Test installazione Linux (.deb, avvio, rimozione)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          sudo dpkg -i "target/uberphoto_${VERSION}_amd64.deb"
          test -x /usr/bin/uberphoto
          test -x /usr/lib/uberphoto/exiftool/exiftool
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 UBERPHOTO_SMOKE_EXIT_SECS=6 \
            xvfb-run -a -s "-screen 0 1280x800x24" /usr/bin/uberphoto 2>&1 | tee -a smoke-output.txt
          sudo dpkg -P uberphoto
          test ! -e /usr/bin/uberphoto

      - name: Smoke test GUI (macOS, sperimentale)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: UBERPHOTO_SMOKE_EXIT_SECS=6 ./target/release/uberphoto-app

      - name: Avvio del bundle macOS (.app)
        if: runner.os == 'macOS'
        run: PATH=/usr/bin:/bin UBERPHOTO_SMOKE_EXIT_SECS=6 ./target/UberPhoto.app/Contents/MacOS/uberphoto

      - name: Smoke test GUI (Windows, sperimentale)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:UBERPHOTO_SMOKE_EXIT_SECS = "6"
          & .\target\release\uberphoto-app.exe
          if ($LASTEXITCODE -ne 0) { throw "uscita con codice $LASTEXITCODE" }

      - name: Test installazione Windows (installer, avvio, disinstallazione)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "target\install-test-log.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          function Write-TestLog([string]$message) {
            $message | Tee-Object -FilePath $log -Append
          }
          try {
            $dir = Join-Path $env:RUNNER_TEMP "UberPhotoInstall"
            if (Test-Path $dir) { Remove-Item -Recurse -Force $dir }
            $setup = (Resolve-Path "target\uberphoto-windows-x86_64-setup.exe").Path
            Write-TestLog "Installazione in $dir"
            $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir" -Wait -PassThru
            Write-TestLog "Exit code installer: $($install.ExitCode)"
            if ($install.ExitCode -ne 0) { throw "installer uscito con codice $($install.ExitCode)" }
            foreach ($file in @("uberphoto.exe", "exiftool.exe", "exiftool_files\exiftool.pl")) {
              if (-not (Test-Path (Join-Path $dir $file))) { throw "file mancante dopo l'installazione: $file" }
            }
            $env:UBERPHOTO_SMOKE_EXIT_SECS = "6"
            $app = Start-Process -FilePath (Join-Path $dir "uberphoto.exe") -Wait -PassThru
            Write-TestLog "Exit code applicazione: $($app.ExitCode)"
            if ($app.ExitCode -ne 0) { throw "avvio uscito con codice $($app.ExitCode)" }
            $uninstaller = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
            if (-not $uninstaller) { throw "disinstaller non trovato in $dir" }
            Write-TestLog "Disinstallazione con $($uninstaller.FullName)"
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            Write-TestLog "Exit code disinstaller: $($uninstall.ExitCode)"
            if ($uninstall.ExitCode -ne 0) { throw "disinstaller uscito con codice $($uninstall.ExitCode)" }
            for ($i = 0; $i -lt 30 -and (Test-Path (Join-Path $dir "uberphoto.exe")); $i++) {
              Start-Sleep -Seconds 1
            }
            if (Test-Path (Join-Path $dir "uberphoto.exe")) { throw "binario ancora presente dopo la disinstallazione" }
            Write-TestLog "Test di installazione completato"
          } catch {
            Write-TestLog "ERRORE: $($_.Exception.Message)"
            throw
          }
