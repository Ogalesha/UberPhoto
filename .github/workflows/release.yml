name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

env:
  EXIFTOOL_VERSION: "13.59"
  EXIFTOOL_SHA256: "668ea3acececb7235fbd0f4900e72d5f12c9b07e5c778fd36cb1e9b5828fd65a"
  EXIFTOOL_WIN_SHA256: "44b512b25af500724ba579d0a53c8fc5851628b692dd5e5d94ae4a15c2cba9ec"

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install metadata engine
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  linux:
    name: Linux package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Debian package (.deb) with bundled ExifTool
        run: bash packaging/linux/build-deb.sh

      - name: Portable archive with bundled ExifTool
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          STAGE=target/linux-portable
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/uberphoto-app "$STAGE/uberphoto"
          cp -a "target/deb/uberphoto_${VERSION}_amd64/usr/lib/uberphoto/exiftool" "$STAGE/exiftool"
          cp packaging/linux/uberphoto.desktop "$STAGE/"
          cp README.md CHANGELOG.md "$STAGE/"
          tar -czf uberphoto-linux-x86_64.tar.gz -C "$STAGE" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-linux
          path: |
            target/uberphoto_*_amd64.deb
            uberphoto-linux-x86_64.tar.gz

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/uberphoto_*_amd64.deb
            uberphoto-linux-x86_64.tar.gz
          generate_release_notes: true

  macos-aarch64:
    name: macOS package (Apple Silicon)
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: .app bundle with bundled ExifTool
        run: MACOS_ARCH=aarch64 bash packaging/macos/bundle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-macos-aarch64
          path: target/uberphoto-macos-aarch64.app.tar.gz

      - name: Attach package to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/uberphoto-macos-aarch64.app.tar.gz
          generate_release_notes: true

  macos-x86_64:
    name: macOS package (Intel, experimental)
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Rust toolchain with Intel target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Release build (Intel cross-compilation)
        run: cargo build --release --locked -p uberphoto-app --target x86_64-apple-darwin

      - name: .app bundle with bundled ExifTool
        run: |
          BIN=target/x86_64-apple-darwin/release/uberphoto-app \
            MACOS_ARCH=x86_64 bash packaging/macos/bundle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-macos-x86_64
          path: target/uberphoto-macos-x86_64.app.tar.gz

      - name: Attach package to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/uberphoto-macos-x86_64.app.tar.gz

  checksums:
    name: Checksums SHA-256
    needs: [linux, macos-aarch64, macos-x86_64, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          cd dist
          sha256sum * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Upload artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: SHA256SUMS

      - name: Attach SHA256SUMS to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: SHA256SUMS

      - name: Mark this release as Latest
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { owner, repo } = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            const release = releases.find(item => item.tag_name === tag);
            if (!release) throw new Error(`Missing draft release ${tag}`);
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false, make_latest: 'true' });
            core.info(`Release ${tag} marked as latest`);

  windows:
    name: Windows package
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Portable ZIP with bundled ExifTool
        shell: pwsh
        run: ./packaging/windows/package.ps1 -ExifToolVersion $env:EXIFTOOL_VERSION -ExifToolSha256 $env:EXIFTOOL_WIN_SHA256 2>&1 | Tee-Object -FilePath target\package-log.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName
          Split-Path $iscc | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Windows installer (.exe) with bundled ExifTool
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          iscc "/DMyAppVersion=$version" packaging\windows\installer.iss 2>&1 | Tee-Object -FilePath target\installer-log.txt
          if ($LASTEXITCODE -ne 0) { throw "iscc exited with code $LASTEXITCODE" }

      - name: Publish packaging log (diagnostics)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            for (const file of ['target/package-log.txt', 'target/installer-log.txt']) {
              try { log += `\n--- ${file} ---\n` + fs.readFileSync(file, 'utf8'); } catch (e) {}
            }
            if (!log) log = 'no log available';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `Log packaging Windows (${context.sha.slice(0, 7)})`,
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Packaging log (tail)', summary: '```\n' + log.slice(-60000) + '\n```' },
            });

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-windows
          path: |
            target/uberphoto-windows-x86_64.zip
            target/uberphoto-windows-x86_64-setup.exe

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            target/uberphoto-windows-x86_64.zip
            target/uberphoto-windows-x86_64-setup.exe
          generate_release_notes: true
