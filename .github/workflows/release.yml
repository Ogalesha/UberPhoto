name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXIFTOOL_VERSION: "13.59"

jobs:
  linux:
    name: Pacchetto Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Pacchetto Debian (.deb) con ExifTool incluso
        run: bash packaging/linux/build-deb.sh

      - name: Archivio portabile con ExifTool incluso
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          STAGE=target/linux-portable
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/uberphoto-app "$STAGE/uberphoto"
          cp -a "target/deb/uberphoto_${VERSION}_amd64/usr/lib/uberphoto/exiftool" "$STAGE/exiftool"
          cp packaging/linux/uberphoto.desktop "$STAGE/"
          cp README.md CHANGELOG.md "$STAGE/"
          tar -czf uberphoto-linux-x86_64.tar.gz -C "$STAGE" .

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-linux
          path: |
            target/uberphoto_*_amd64.deb
            uberphoto-linux-x86_64.tar.gz

      - name: Allega i pacchetti alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/uberphoto_*_amd64.deb
            uberphoto-linux-x86_64.tar.gz
          generate_release_notes: true

  macos-aarch64:
    name: Pacchetto macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: Bundle .app con ExifTool incluso
        run: MACOS_ARCH=aarch64 bash packaging/macos/bundle.sh

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-macos-aarch64
          path: target/uberphoto-macos-aarch64.app.tar.gz

      - name: Allega il pacchetto alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/uberphoto-macos-aarch64.app.tar.gz
          generate_release_notes: true

  macos-x86_64:
    name: Pacchetto macOS (Intel, sperimentale)
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust con target Intel
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release (cross-compilazione Intel)
        run: cargo build --release --locked -p uberphoto-app --target x86_64-apple-darwin

      - name: Bundle .app con ExifTool incluso
        run: |
          BIN=target/x86_64-apple-darwin/release/uberphoto-app \
            MACOS_ARCH=x86_64 bash packaging/macos/bundle.sh

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-macos-x86_64
          path: target/uberphoto-macos-x86_64.app.tar.gz

      - name: Allega il pacchetto alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/uberphoto-macos-x86_64.app.tar.gz

  windows:
    name: Pacchetto Windows
    runs-on: windows-latest
    steps:
      - name: Checkout del sorgente
        uses: actions/checkout@v4

      - name: Toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked -p uberphoto-app

      - name: ZIP portabile con ExifTool incluso
        shell: pwsh
        run: ./packaging/windows/package.ps1 -ExifToolVersion $env:EXIFTOOL_VERSION

      - name: Installa Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Installer Windows (.exe) con ExifTool incluso
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"$').Matches[0].Groups[1].Value
          iscc "/DMyAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc uscito con codice $LASTEXITCODE" }

      - name: Carica artifact
        uses: actions/upload-artifact@v4
        with:
          name: uberphoto-windows
          path: |
            target/uberphoto-windows-x86_64.zip
            target/uberphoto-windows-x86_64-setup.exe

      - name: Allega i pacchetti alla Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/uberphoto-windows-x86_64.zip
            target/uberphoto-windows-x86_64-setup.exe
          generate_release_notes: true
